name: HudGram CI (Docker)

'on':
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
    tags-ignore:
      - 'v*'
      - 'release-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test & Build Debug (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Runner Diagnostics (Disk, Memory, CPU)
        run: |
          echo "=== Disk Space ==="
          df -h
          echo "=== Memory Info ==="
          free -h
          echo "=== CPU Cores ==="
          nproc

      - name: Prepare build environment
        run: |
          # Strip local developer machine-specific java.home from gradle.properties
          sed -i '/org\.gradle\.java\.home/d' gradle.properties
          chmod +x gradlew
          mkdir -p .gradle_cache dist

      - name: Cache Gradle Packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.2
        with:
          path: |
            .gradle_cache/caches
            .gradle_cache/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.10.0

      - name: Build and Cache Docker Builder Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.15.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: hudgram-builder:local
          cache-from: type=gha,scope=docker-hudgram-v2
          cache-to: type=gha,mode=max,scope=docker-hudgram-v2

      - name: Validate Container Environment & Permissions
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e ANDROID_USER_HOME=/tmp/.android \
            -e GRADLE_USER_HOME=/workspace/.gradle_cache \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            hudgram-builder:local \
            bash -c '
              set -e
              echo "=== Container User & Environment Check ==="
              id
              printf "HOME=%s\nANDROID_USER_HOME=%s\nGRADLE_USER_HOME=%s\n" "$HOME" "$ANDROID_USER_HOME" "$GRADLE_USER_HOME"
              mkdir -p "$HOME" "$ANDROID_USER_HOME" "$GRADLE_USER_HOME"
              test -r "$ANDROID_HOME/platforms/android-36"
              test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
              touch "$GRADLE_USER_HOME/.write-test"
              rm -f "$GRADLE_USER_HOME/.write-test"
              echo "Environment and permissions check passed!"
            '

      - name: Run Verification and Debug Build in Docker
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e ANDROID_USER_HOME=/tmp/.android \
            -e GRADLE_USER_HOME=/workspace/.gradle_cache \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            hudgram-builder:local \
            ./gradlew checkKotlinGradlePluginConfigurationErrors :TMessagesProj_App:testAfatDebugUnitTest :TMessagesProj_App:assembleAfatDebug --no-daemon

      - name: Package Debug Artifact
        run: |
          DEBUG_APK="TMessagesProj_App/build/outputs/apk/afat/debug/app.apk"
          if [ ! -f "$DEBUG_APK" ]; then
            echo "::error::Debug APK not found at $DEBUG_APK"
            ls -la TMessagesProj_App/build/outputs/apk/afat/debug || true
            exit 1
          fi
          cp "$DEBUG_APK" dist/HudGram-debug.apk
          echo "Successfully packaged debug APK:"
          ls -lh dist/HudGram-debug.apk

      - name: Upload CI Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: HudGram-Debug-APK
          path: dist/HudGram-debug.apk
          if-no-files-found: error
          retention-days: 7
