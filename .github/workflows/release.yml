name: HudGram Release (Docker)

'on':
  push:
    branches: [ master ]
    tags:
      - 'v*'
      - 'release-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Sign HudGram Release (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Runner Diagnostics (Disk, Memory, CPU)
        run: |
          echo "=== Disk Space ==="
          df -h
          echo "=== Memory Info ==="
          free -h
          echo "=== CPU Cores ==="
          nproc

      - name: Prepare build environment
        run: |
          # Strip local developer machine-specific java.home from gradle.properties
          sed -i '/org\.gradle\.java\.home/d' gradle.properties
          chmod +x gradlew
          mkdir -p .gradle_cache dist

      - name: Cache Gradle Packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.2
        with:
          path: |
            .gradle_cache/caches
            .gradle_cache/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.10.0

      - name: Build and Cache Docker Builder Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.15.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: hudgram-builder:local
          cache-from: type=gha,scope=docker-hudgram-v2
          cache-to: type=gha,mode=max,scope=docker-hudgram-v2

      - name: Validate and decode signing keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY_BASE64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "::error::Missing signing secrets! Ensure SIGNING_KEY_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, and SIGNING_KEY_PASSWORD are set."
            exit 1
          fi
          echo "$SIGNING_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/hudgram_keystore.jks"
          if [ ! -s "$RUNNER_TEMP/hudgram_keystore.jks" ]; then
            echo "::error::Decoded keystore file is empty or Base64 decoding failed."
            exit 1
          fi
          # Least privilege: readable ONLY by owner (the runner user whose UID is passed to Docker)
          chmod 400 "$RUNNER_TEMP/hudgram_keystore.jks"

      - name: Validate Container Environment & Keystore Permissions
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e ANDROID_USER_HOME=/tmp/.android \
            -e GRADLE_USER_HOME=/workspace/.gradle_cache \
            -v "${{ github.workspace }}:/workspace" \
            -v "$RUNNER_TEMP/hudgram_keystore.jks:/tmp/hudgram_keystore.jks:ro" \
            -w /workspace \
            hudgram-builder:local \
            bash -c '
              set -e
              echo "=== Container User & Environment Check ==="
              id
              printf "HOME=%s\nANDROID_USER_HOME=%s\nGRADLE_USER_HOME=%s\n" "$HOME" "$ANDROID_USER_HOME" "$GRADLE_USER_HOME"
              mkdir -p "$HOME" "$ANDROID_USER_HOME" "$GRADLE_USER_HOME"
              test -r "$ANDROID_HOME/platforms/android-36"
              test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
              test -r "/tmp/hudgram_keystore.jks"
              touch "$GRADLE_USER_HOME/.write-test"
              rm -f "$GRADLE_USER_HOME/.write-test"
              echo "Keystore read check and environment check passed!"
            '

      - name: Build Signed Release and Beta APKs and AAB inside Docker
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e ANDROID_USER_HOME=/tmp/.android \
            -e GRADLE_USER_HOME=/workspace/.gradle_cache \
            -e SIGNING_KEY_FILE=/tmp/hudgram_keystore.jks \
            -e SIGNING_STORE_PASSWORD="$SIGNING_STORE_PASSWORD" \
            -e SIGNING_KEY_ALIAS="$SIGNING_KEY_ALIAS" \
            -e SIGNING_KEY_PASSWORD="$SIGNING_KEY_PASSWORD" \
            -v "${{ github.workspace }}:/workspace" \
            -v "$RUNNER_TEMP/hudgram_keystore.jks:/tmp/hudgram_keystore.jks:ro" \
            -w /workspace \
            hudgram-builder:local \
            ./gradlew :TMessagesProj_App:assembleAfatRelease :TMessagesProj_App:assembleAfatDebug :TMessagesProj_App:bundleAfatRelease --no-daemon

      - name: Clean up temporary keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/hudgram_keystore.jks"

      - name: Package artifacts to dist/
        run: |
          mkdir -p dist

          RELEASE_APK="TMessagesProj_App/build/outputs/apk/afat/release/app.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Release APK not found at expected path: $RELEASE_APK"
            ls -la TMessagesProj_App/build/outputs/apk/afat/release || true
            exit 1
          fi

          BETA_APK="TMessagesProj_App/build/outputs/apk/afat/debug/app.apk"
          if [ ! -f "$BETA_APK" ]; then
            echo "::error::Beta APK not found at expected path: $BETA_APK"
            ls -la TMessagesProj_App/build/outputs/apk/afat/debug || true
            exit 1
          fi

          shopt -s nullglob
          AAB_FILES=( TMessagesProj_App/build/outputs/bundle/afatRelease/*.aab )
          shopt -u nullglob

          if [ ${#AAB_FILES[@]} -ne 1 ]; then
            echo "::error::Expected exactly 1 AAB file under TMessagesProj_App/build/outputs/bundle/afatRelease, found ${#AAB_FILES[@]}"
            ls -la TMessagesProj_App/build/outputs/bundle/afatRelease || true
            exit 1
          fi
          AAB_FILE="${AAB_FILES[0]}"

          cp "$RELEASE_APK" dist/HudGram.apk
          cp "$BETA_APK" dist/HudGram-Beta.apk
          cp "$AAB_FILE" dist/HudGram.aab

          if [ ! -s dist/HudGram.apk ] || [ ! -s dist/HudGram-Beta.apk ] || [ ! -s dist/HudGram.aab ]; then
            echo "::error::One or more output files in dist/ are empty!"
            exit 1
          fi

          echo "Successfully packaged artifacts into dist/:"
          ls -lh dist/

      - name: Verify APK Signatures with apksigner (Inside Docker)
        run: |
          echo "=== Verifying Release APK (dist/HudGram.apk) ==="
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            hudgram-builder:local \
            apksigner verify --verbose dist/HudGram.apk

          echo "=== Verifying Beta APK (dist/HudGram-Beta.apk) ==="
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            hudgram-builder:local \
            apksigner verify --verbose dist/HudGram-Beta.apk

      - name: Generate Cryptographic SHA256 Checksums
        run: |
          cd dist
          sha256sum HudGram.apk HudGram-Beta.apk HudGram.aab > SHA256SUMS.txt
          echo "Generated SHA256 Checksums:"
          cat SHA256SUMS.txt

      - name: Upload Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: HudGram-Release-APK
          path: dist/HudGram.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Beta APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: HudGram-Beta-APK
          path: dist/HudGram-Beta.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: HudGram-Release-AAB
          path: dist/HudGram.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: HudGram-Checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Official GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Release Artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: dist/
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.2.1
        with:
          files: |
            dist/HudGram.apk
            dist/HudGram-Beta.apk
            dist/HudGram.aab
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
